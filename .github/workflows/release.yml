name: Build and publish NicoValBolaLibre for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test popup and redirect protection
        run: node scripts/test-navigation-guard.js
      - name: Inject automatic read-only Cloud Sync settings
        env:
          NVB_SYNC_READ_TOKEN: ${{ secrets.NVB_SYNC_READ_TOKEN }}
          NVB_SYNC_URL: https://nicoval-sync.tracker-mps.workers.dev
        run: node scripts/write-cloud-sync-defaults.js
      - name: Install dependencies
        run: npm install
      - name: Build installer and publish release assets
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
